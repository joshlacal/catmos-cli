[workspace]
members = ["catmos", "catmos-core", "catmos-tui"]
resolver = "2"

[workspace.dependencies]
catmos-core = { path = "catmos-core" }
catmos-tui = { path = "catmos-tui" }
catbird-mls = { path = "../catbird-mls", package = "catbird_mls" }
catbird-atproto = { path = "../catbird-atproto", features = ["streaming"] }
jacquard = { version = "0.13.0", git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40" }
jacquard-common = { version = "0.13.0", git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40", features = ["websocket"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
bytes = { version = "1.12.1", features = ["serde"] }
ulid = "3.0.0"
labyrinth-protocol = { path = "../labyrinth/labyrinth-protocol" }
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }

[patch.crates-io]
# Keep SQLx and the shared MLS provider linked to one maintained SQLite ABI.
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }

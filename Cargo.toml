[workspace]
members = ["catmos", "catmos-core", "catmos-tui"]
resolver = "2"

[workspace.dependencies]
catmos-core = { path = "catmos-core" }
catmos-tui = { path = "catmos-tui" }
catbird-mls = { path = "../catbird-mls", package = "catbird_mls" }
catbird-atproto = { path = "../catbird-atproto", features = ["streaming"] }
jacquard = "0.9"
jacquard-common = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
bytes = { version = "1", features = ["serde"] }
ulid = "1"

[workspace]
members = ["catmos", "catmos-core", "catmos-tui"]
resolver = "2"

[workspace.dependencies]
catmos-core = { path = "catmos-core" }
catmos-tui = { path = "catmos-tui" }
catbird-mls = { path = "../catbird-mls", package = "catbird_mls", features = ["legacy-orchestrator"] }
petrel = { path = "../Petrel/rust/petrel" }
petrel-api = { path = "../Petrel/rust/petrel-api", features = ["com_atproto"] }
petrel-core = { path = "../Petrel/rust/petrel-core" }
petrel-catbird = { path = "../PetrelCatbird/rust/petrel-catbird" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
bytes = { version = "1", features = ["serde"] }
ulid = "1"

[package]
name = "catmos-core"
version = "0.1.0"
edition = "2021"

[dependencies]
catbird-mls = { workspace = true }
catbird-atproto = { workspace = true }
jacquard = { workspace = true }
jacquard-common = { workspace = true }
jacquard-identity = { version = "0.13.0", git = "https://github.com/joshlacal/jacquard", rev = "1f5bcf1570c5978aa03d997dd7eef0b9ef25430d" }
url = "2.5.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = { version = "0.39.1", features = ["bundled-sqlcipher"], default-features = false }
keyring = { package = "keyring-core", version = "1.0.1" }
toml = "0.9.8"
dirs = "7.0.0"
base64 = "0.23.1"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = "0.4.45"
hex = "0.4.3"
serde_ipld_dagcbor = "0.7.0"
ulid = { workspace = true }
sha2 = "0.11.1"
reqwest = { version = "0.13.5", features = ["query", "json"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
axum = "0.8.9"
open = "5.4.5"
async-trait = "0.1.92"
rand = "0.10.3"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = "0.3.34"
hostname = "0.4.2"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

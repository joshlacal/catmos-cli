[package]
name = "catmos-core"
version = "0.1.0"
edition = "2021"

[dependencies]
catbird-mls = { workspace = true }
catbird-atproto = { workspace = true }
jacquard = { workspace = true }
jacquard-common = { workspace = true }
jacquard-identity = "0.9"
url = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher"], default-features = false }
keyring = { version = "3", features = ["apple-native", "linux-native"] }
toml = "0.8"
dirs = "6"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
hex = "0.4"
serde_ipld_dagcbor = "0.6"
ulid = { workspace = true }
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.8"
open = "5"
async-trait = "0.1"
rand = "0.8"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
hostname = "0.4"
